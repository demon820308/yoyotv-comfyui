[package]
name = "takeboard-desktop"
version = "1.0.0-beta.2"
description = "Native desktop host for the YoYoTV local-first filmmaking workspace"
authors = ["YoYoTV contributors", "TakeBoard contributors"]
edition = "2021"
rust-version = "1.77.2"
license = "Apache-2.0"
repository = "https://github.com/demon820308/yoyotv-comfyui"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
open = "5.4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-shell = "2.3.6"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"

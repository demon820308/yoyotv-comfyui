      <stop offset="0%" stop-color="#fff1c5"/>
      <stop offset="35%" stop-color="#e2b86b"/>
      <stop offset="100%" stop-color="#b68836"/>
    </linearGradient>
    <linearGradient id="tb-teal" x1="85%" y1="90%" x2="15%" y2="10%">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="vf-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae2af"/>
      <stop offset="50%" stop-color="#d8ab60"/>
      <stop offset="100%" stop-color="#9a712a"/>
    </linearGradient>
    <radialGradient id="vf-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#141816"/>
      <stop offset="60%" stop-color="#0d110f"/>
      <stop offset="100%" stop-color="#060807"/>
    </radialGradient>
    <filter id="vf-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect width="512" height="512" rx="118" fill="url(#vf-bg)"/>
  <rect x="2" y="2" width="508" height="508" rx="116" stroke="rgba(216,171,96,0.2)" stroke-width="2"/>

  <!-- 2.39:1 Anamorphic Framing Brackets -->
  <g stroke="url(#vf-gold)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <!-- Top-Left -->
    <path d="M 120 180 L 120 130 L 170 130"/>
    <!-- Top-Right -->
    <path d="M 342 130 L 392 130 L 392 180"/>
    <!-- Bottom-Left -->
    <path d="M 120 332 L 120 382 L 170 382"/>
    <!-- Bottom-Right -->
    <path d="M 342 382 L 392 382 L 392 332"/>
  </g>

  <!-- Fine Inner 16:9 Dashed Guide -->
  <rect x="150" y="160" width="212" height="192" rx="8" stroke="#48c088" stroke-width="2" stroke-dasharray="6 8" opacity="0.4"/>

  <!-- Bold Geometric Monogram "Y" -->
  <g filter="url(#vf-glow)">
    <!-- Left diagonal arm of Y -->
    <path d="M 172 170 L 256 268 L 256 362" stroke="url(#vf-gold)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right diagonal arm of Y -->
    <path d="M 340 170 L 256 268" stroke="#48c088" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
  </g>

  <!-- Center Anamorphic Optical Aperture Reticle -->
  <circle cx="256" cy="268" r="22" fill="#0d110f" stroke="#fae2af" stroke-width="5"/>
  <polygon points="256,252 260,264 272,268 260,272 256,284 252,272 240,268 252,264" fill="#fae2af"/>
  <circle cx="256" cy="268" r="4" fill="#ef4444"/>

  <!-- Telemetry Footnotes -->
  <text x="256" y="440" text-anchor="middle" fill="#d8ab60" font-size="20" font-family="ui-monospace, monospace" font-weight="700" letter-spacing="6">YOYO CINEMA</text>
  <text x="256" y="464" text-anchor="middle" fill="#87908c" font-size="12" font-family="ui-monospace, monospace" letter-spacing="3">4K DCI · 2.39:1</text>
</svg>

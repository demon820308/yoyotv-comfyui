<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="yoyo-gold-grad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#fff1c5"/>
      <stop offset="35%" stop-color="#e2b86b"/>
      <stop offset="100%" stop-color="#b68836"/>
    </linearGradient>
    <linearGradient id="yoyo-teal-grad" x1="85%" y1="90%" x2="15%" y2="10%">
      <stop offset="0%" stop-color="#3eb885"/>
      <stop offset="60%" stop-color="#6ad5a3"/>
      <stop offset="100%" stop-color="#b8f2d5"/>
    </linearGradient>
    <radialGradient id="yoyo-bg-glow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#18231e"/>
      <stop offset="65%" stop-color="#0e1311"/>
      <stop offset="100%" stop-color="#070908"/>
    </radialGradient>
    <filter id="yoyo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle App Icon Container -->
  <rect width="512" height="512" rx="118" fill="url(#yoyo-bg-glow)"/>
  <rect x="2" y="2" width="508" height="508" rx="116" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Subtle Film Perforation Marks on Top & Bottom Outer Margins -->
  <g opacity="0.18" fill="#e2b86b">
    <rect x="110" y="26" width="22" height="14" rx="4"/>
    <rect x="160" y="26" width="22" height="14" rx="4"/>
    <rect x="210" y="26" width="22" height="14" rx="4"/>
    <rect x="260" y="26" width="22" height="14" rx="4"/>
    <rect x="310" y="26" width="22" height="14" rx="4"/>
    <rect x="360" y="26" width="22" height="14" rx="4"/>

    <rect x="110" y="472" width="22" height="14" rx="4"/>
    <rect x="160" y="472" width="22" height="14" rx="4"/>
    <rect x="210" y="472" width="22" height="14" rx="4"/>
    <rect x="260" y="472" width="22" height="14" rx="4"/>
    <rect x="310" y="472" width="22" height="14" rx="4"/>
    <rect x="360" y="472" width="22" height="14" rx="4"/>
  </g>

  <!-- Ambient Light Reflection -->
  <ellipse cx="256" cy="180" rx="160" ry="80" fill="#e2b86b" opacity="0.06"/>

  <!-- Core Motif: The YoYo Mobius Cine-Loop Ribbon -->
  <!-- Upper Loop / Left "Y" Branch -->
  <path d="M 130 148 C 130 230, 206 256, 256 256 C 306 256, 382 230, 382 148 C 382 108, 338 88, 290 102 C 238 116, 204 178, 172 232 C 142 284, 130 338, 158 382 C 188 428, 256 428, 256 428" 
        stroke="url(#yoyo-gold-grad)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round" filter="url(#yoyo-glow)"/>

  <!-- Lower Interlocking Loop / Right "Y" Counter-Branch -->
  <path d="M 382 364 C 382 282, 306 256, 256 256 C 206 256, 130 282, 130 364 C 130 404, 174 424, 222 410 C 274 396, 308 334, 340 280 C 370 228, 382 174, 354 130 C 324 84, 256 84, 256 84" 
        stroke="url(#yoyo-teal-grad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>

  <!-- Optical Central Viewfinder Focal Core -->
  <circle cx="256" cy="256" r="32" fill="#0c110f" stroke="#e2b86b" stroke-width="6"/>
  <circle cx="256" cy="256" r="14" fill="#6ad5a3"/>
  <circle cx="256" cy="256" r="6" fill="#ffffff"/>
  
  <!-- Optical Crosshair Ticks -->
  <line x1="256" y1="208" x2="256" y2="218" stroke="#e2b86b" stroke-width="4" stroke-linecap="round"/>
  <line x1="256" y1="294" x2="256" y2="304" stroke="#e2b86b" stroke-width="4" stroke-linecap="round"/>
  <line x1="208" y1="256" x2="218" y2="256" stroke="#e2b86b" stroke-width="4" stroke-linecap="round"/>
  <line x1="294" y1="256" x2="304" y2="256" stroke="#e2b86b" stroke-width="4" stroke-linecap="round"/>
</svg>

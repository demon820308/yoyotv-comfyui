<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 120" fill="none">
  <defs>
    <linearGradient id="logo-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1c5"/>
      <stop offset="50%" stop-color="#e2b86b"/>
      <stop offset="100%" stop-color="#b68836"/>
    </linearGradient>
    <linearGradient id="logo-teal" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3eb885"/>
      <stop offset="100%" stop-color="#a4f0cb"/>
    </linearGradient>
  </defs>

  <!-- Left Icon Mark (100x100) -->
  <g transform="translate(10, 10)">
    <rect width="100" height="100" rx="24" fill="#101513" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
    <!-- Interlocking Loops -->
    <path d="M 28 32 C 28 48, 42 50, 50 50 C 58 50, 72 48, 72 32 C 72 22, 64 20, 56 22 C 46 24, 40 36, 34 46 C 28 56, 26 66, 32 74 C 38 82, 50 82, 50 82" 
          stroke="url(#logo-gold)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 72 68 C 72 52, 58 50, 50 50 C 42 50, 28 52, 28 68 C 28 78, 36 80, 44 78 C 54 76, 60 64, 66 54 C 72 44, 74 34, 68 26 C 62 18, 50 18, 50 18" 
          stroke="url(#logo-teal)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Center Iris Core -->
    <circle cx="50" cy="50" r="7" fill="#0c110f" stroke="#e2b86b" stroke-width="2"/>
    <circle cx="50" cy="50" r="2.5" fill="#6ad5a3"/>
  </g>

  <!-- Right Typography Wordmark -->
  <g transform="translate(132, 24)">
    <!-- Primary Brand Name "YoYo" -->
    <text x="0" y="52" fill="#ffffff" font-size="54" font-family="Inter, -apple-system, 'SF Pro Display', 'PingFang SC', sans-serif" font-weight="800" letter-spacing="-1.5">
      Yo<tspan fill="url(#logo-gold)">Yo</tspan>
    </text>
    
    <!-- Secondary Product Subtitle -->
    <text x="3" y="78" fill="#d2ad72" font-size="13" font-family="ui-monospace, SFMono-Regular, monospace" font-weight="600" letter-spacing="4.5">
      FILMMAKING WORKSPACE
    </text>

    <!-- Version Badge Tag -->
    <rect x="256" y="24" width="46" height="18" rx="4" fill="rgba(210,173,114,0.15)" stroke="rgba(210,173,114,0.3)" stroke-width="1"/>
    <text x="279" y="37" text-anchor="middle" fill="#d2ad72" font-size="9.5" font-family="ui-monospace, monospace" font-weight="700" letter-spacing="1">PRO</text>
  </g>
</svg>

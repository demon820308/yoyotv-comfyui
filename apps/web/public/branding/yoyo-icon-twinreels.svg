<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="reel-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d696"/>
      <stop offset="100%" stop-color="#b68836"/>
    </linearGradient>
    <radialGradient id="reel-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#141715"/>
      <stop offset="100%" stop-color="#080a09"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="118" fill="url(#reel-bg)"/>
  <rect x="2" y="2" width="508" height="508" rx="116" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>

  <!-- Left Reel ("Y" / "O" 1) -->
  <g transform="translate(180, 200)">
    <circle cx="0" cy="0" r="92" fill="#1b211e" stroke="url(#reel-gold)" stroke-width="14"/>
    <circle cx="0" cy="0" r="48" fill="#0d110f" stroke="#87908c" stroke-width="4"/>
    <circle cx="0" cy="0" r="16" fill="url(#reel-gold)"/>
    <!-- 3-Spoke Film Reel Apertures -->
    <path d="M 0 -48 L 0 -80 M 41 24 L 69 40 M -41 24 L -69 40" stroke="#080a09" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Right Reel ("Y" / "O" 2) -->
  <g transform="translate(332, 312)">
    <circle cx="0" cy="0" r="92" fill="#1b211e" stroke="#48c088" stroke-width="14"/>
    <circle cx="0" cy="0" r="48" fill="#0d110f" stroke="#87908c" stroke-width="4"/>
    <circle cx="0" cy="0" r="16" fill="#48c088"/>
    <!-- 3-Spoke Film Reel Apertures -->
    <path d="M 0 -48 L 0 -80 M 41 24 L 69 40 M -41 24 L -69 40" stroke="#080a09" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Dynamic S-Curve Film Strip Connecting the Two Reels -->
  <path d="M 180 108 C 260 108, 250 404, 332 404" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
  <path d="M 180 108 C 260 108, 250 404, 332 404" stroke="url(#reel-gold)" stroke-width="6" stroke-linecap="round"/>

  <!-- Central Film Gate Lens Sensor Node -->
  <circle cx="256" cy="256" r="26" fill="#080a09" stroke="#ffffff" stroke-width="4"/>
  <circle cx="256" cy="256" r="12" fill="#ef4444"/>
</svg>

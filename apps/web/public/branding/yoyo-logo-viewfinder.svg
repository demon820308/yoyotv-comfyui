<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 120" fill="none">
  <defs>
    <linearGradient id="lv-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae2af"/>
      <stop offset="100%" stop-color="#ba8d38"/>
    </linearGradient>
  </defs>

  <!-- Left Viewfinder Mark (100x100) -->
  <g transform="translate(10, 10)">
    <rect width="100" height="100" rx="24" fill="#141716" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
    <!-- Framing Brackets -->
    <path d="M 24 38 L 24 26 L 36 26" stroke="url(#lv-gold)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 64 26 L 76 26 L 76 38" stroke="url(#lv-gold)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 24 62 L 24 74 L 36 74" stroke="url(#lv-gold)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 64 74 L 76 74 L 76 62" stroke="url(#lv-gold)" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Geometric Y and Crosshair -->
    <path d="M 34 35 L 50 54 L 50 72" stroke="url(#lv-gold)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 66 35 L 50 54" stroke="#48c088" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="50" cy="54" r="3" fill="#ef4444"/>
  </g>

  <!-- Typography Wordmark -->
  <g transform="translate(132, 24)">
    <text x="0" y="52" fill="#ffffff" font-size="52" font-family="Inter, -apple-system, 'SF Pro Display', 'PingFang SC', sans-serif" font-weight="800" letter-spacing="-1">
      YOYO
    </text>
    <text x="3" y="78" fill="#48c088" font-size="12" font-family="ui-monospace, SFMono-Regular, monospace" font-weight="700" letter-spacing="4">
      FILMMAKING WORKSPACE
    </text>
  </g>
</svg>
